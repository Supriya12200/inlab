<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Booking</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #18324b; background: #f3f7fb; }
    body { margin: 0; }
    main { max-width: 760px; margin: 3rem auto; padding: 2rem; background: white; border-radius: 16px; box-shadow: 0 12px 36px #18324b18; }
    h1 { margin-top: 0; }
    .rooms { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    .room { border: 1px solid #d7e1eb; border-radius: 12px; padding: 1rem; }
    .room h2 { font-size: 1.1rem; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: 2rem; }
    label { display: grid; gap: .4rem; }
    input, select, button { font: inherit; padding: .7rem; border: 1px solid #b8c8d8; border-radius: 8px; }
    button { background: #176b87; color: white; border: 0; cursor: pointer; }
    #confirmation { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <main>
    <h1>Hotel Booking</h1>
    <p>Choose a room, then book your stay.</p>
    <section class="rooms" aria-label="Available rooms">
      <article class="room"><h2>Classic Room</h2><p>Comfortable stay for two.</p></article>
      <article class="room"><h2>Garden Suite</h2><p>Extra space with a garden view.</p></article>
    </section>
    <form id="booking-form">
      <label>Guest name <input name="guest" required autocomplete="name"></label>
      <label>Room <select name="room"><option>Classic Room</option><option>Garden Suite</option></select></label>
      <label>Check-in <input name="checkin" type="date" required></label>
      <label>Check-out <input name="checkout" type="date" required></label>
      <button type="submit">Book stay</button>
      <p id="confirmation" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    document.querySelector('#booking-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      document.querySelector('#confirmation').textContent = `${data.get('guest')}, your ${data.get('room')} is requested for ${data.get('checkin')} to ${data.get('checkout')}.`;
    });
  </script>
</body>
</html>
